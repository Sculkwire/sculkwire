name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

      # The in-game agent DLL and injector, built from native/ with rustup alone (rust-lld, no Windows SDK). The engine
      # build driver downloads this zip when no cargo is installed and checks it against the .sha256 file. cargo reads
      # native/.cargo/config.toml from the working directory, so the build runs inside native/.
      - name: Build the in-game agent
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-msvc
          (cd native && cargo build --release --locked --target x86_64-pc-windows-msvc)
          version="$(node -p "require('./package.json').version")"
          zip="sculkwire-agent-$version-x86_64-windows.zip"
          out=native/target/x86_64-pc-windows-msvc/release
          (cd "$out" && zip -9 "$GITHUB_WORKSPACE/$zip" sculkwire_agent.dll sculkwire-injector.exe)
          sha256sum "$zip" | cut -d' ' -f1 > "$zip.sha256"
          echo "AGENT_ZIP=$zip" >> "$GITHUB_ENV"

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          awk -v tag="## $GITHUB_REF_NAME" '
            $0 == tag { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section $GITHUB_REF_NAME"; exit 1; }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Sculkwire $GITHUB_REF_NAME" --notes-file notes.md --verify-tag "$AGENT_ZIP" "$AGENT_ZIP.sha256"
